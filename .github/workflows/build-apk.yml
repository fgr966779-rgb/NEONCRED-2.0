name: Build NEONCRED APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Drift code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0-build${{ github.run_number }}
          name: NEONCRED v2.0.0 Build #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            NEONCRED 2.0 — Cyberpunk Savings App

            Automatic build from commit ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
